name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests and end-to-end scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit and integration tests (shortener + orchestrator)
        run: ./mvnw -B -ntp test

      - name: End-to-end scenarios (greenfield, brownfield, ambiguous)
        run: ./mvnw -B -ntp -f sdlc-orchestrator/pom.xml test -Pe2e

      - name: Summarize scenario runs
        if: always()
        run: |
          {
            echo "## Scenario runs"
            echo
            echo "| Run | Scenario | Status | Duration |"
            echo "|---|---|---|---|"
            for f in runs/run-*/state.json; do
              [ -f "$f" ] || continue
              jq -r '"| \(.runId) | \(.scenarioId) | \(.status) | \(.durationMs / 1000 | floor)s |"' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run outputs (patch, PR description, engineering summary, audit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-run-outputs
          path: |
            runs/*/output/
            runs/*/audit.jsonl
            runs/*/state.json
          if-no-files-found: warn
          retention-days: 30
